version: 2
updates:
  # Keep GitHub Actions themselves up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dependabot has no R ecosystem. R dependencies are declared with minimum
  # versions in DESCRIPTION, and the weekly scheduled CI run checks the
  # package against current CRAN.
