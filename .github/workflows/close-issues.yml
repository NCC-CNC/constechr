name: Close linked issues

# GitHub acts on closing keywords ("Closes #N", "Fixes #N", "Resolves #N")
# only when a PR merges into the default branch, which is main (ADR 0024).
# Work merges into dev, so when a PR into dev merges, this closes the issues
# its body names with those keywords, with a comment naming the PR (#114).
#
# pull_request_target runs this file as it is on dev, with a token that can
# write issues, also for PRs from forks. It never checks out the PR's code;
# it reads only the PR body, passed in as an environment variable.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close issues named by closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Keywords as GitHub reads them: close(s|d), fix(es|ed),
          # resolve(s|d), an optional colon, then #N or owner/repo#N for
          # this repo.
          issues=$(printf '%s\n' "$BODY" |
            grep -oiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(${GH_REPO})?#[0-9]+" |
            grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$issues" ]; then
            echo "no linked issues"
            exit 0
          fi
          for n in $issues; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo "MISSING")
            case "$state" in
              OPEN)
                gh issue close "$n" --comment "Closed by #$PR, merged into dev."
                echo "closed #$n"
                ;;
              *) echo "#$n not open ($state), left alone" ;;
            esac
          done
