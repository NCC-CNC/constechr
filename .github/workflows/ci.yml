name: CI

# PRs only: with strict branch protection every PR is tested against current
# main before it merges, so a run on push to main would test the same code
# again. If you do not use strict protection, add this back under `on:` so a
# fresh repo gets a first run:
#   push:
#     branches: [main]
#
# Weekly: R dependencies are only pinned to minimum versions, so a new sf or
# terra release can break the package with no commit here. The scheduled run
# checks main against current CRAN, and also saves the R package cache on
# main, which PRs can read. workflow_dispatch allows a manual run.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Layout:
# - changes: says whether the PR touches anything besides docs and Markdown
#   (always "yes" outside a PR).
# - repo-hygiene: stack-neutral checks, always runs.
# - style-lint: styler and lintr. Skipped on docs-only PRs.
# - r-cmd-check: R CMD check (build, tests, examples, docs) on Ubuntu and
#   Windows, plus a run without Suggests. Skipped on docs-only PRs.
# - coverage: test coverage, reported in the log. Not a gate.
# - checks: the one required status check. It passes when every job it needs
#   passed or was skipped. Branch protection names only this job, so adding or
#   renaming a job never means touching the protection rules.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  style-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LINTR_ERROR_ON_LINT: true
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, local::.
          needs: lint

      - name: Check formatting (styler)
        run: styler::style_pkg(dry = "fail")
        shell: Rscript {0}

      - name: Lint (lintr)
        run: lintr::lint_package()
        shell: Rscript {0}

  r-cmd-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.config.os }}
    name: r-cmd-check (${{ matrix.config.os }}, ${{ matrix.config.deps }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, deps: 'all'}
          - {os: windows-latest, deps: 'all'}
          # Without Suggests: optional packages must be checked for, not
          # assumed. testthat is still installed to run the tests.
          - {os: ubuntu-latest, deps: 'hard'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # The --as-cran time check needs an outside time server; skip it.
      _R_CHECK_SYSTEM_CLOCK_: false
    steps:
      # Keep LF line endings on Windows, so the check sees the same files.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-snapshots: true

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      # Report only: a failure here does not fail the job or the checks.
      - name: Test coverage
        continue-on-error: true
        run: print(covr::package_coverage())
        shell: Rscript {0}

  checks:
    needs: [changes, repo-hygiene, style-lint, r-cmd-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - name: Lint markdown
        run: npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore LICENSE.md

      - name: No em dashes in tracked text
        run: |
          if git grep -In $'\xe2\x80\x94' -- . ':!LICENSE.md'; then
            echo "Em dash found. See CLAUDE.md: no em dashes in code, comments, docs, or commit messages." >&2
            exit 1
          fi

      - name: Docs structure present
        run: |
          test -f CLAUDE.md
          test -f docs/decisions/README.md
          test -f docs/handoffs/HANDOFF_TEMPLATE.md
          test -d docs/design
