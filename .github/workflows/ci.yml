name: CI

# PRs only: with strict branch protection every PR is tested against the
# current tip of its base (dev, or main for a promotion; ADR 0024) before it
# merges, so a run on push would test the same code again. If you do not use
# strict protection, add this back under `on:` so a fresh repo gets a first
# run:
#   push:
#     branches: [dev, main]
#
# Weekly: R dependencies are only pinned to minimum versions, so a new sf or
# terra release can break the package with no commit here. weekly.yml starts
# this workflow on dev and on main each week (workflow_dispatch), checking
# both against current CRAN; the run on dev also saves the R package cache
# there, which PRs into dev can read. workflow_dispatch also allows a manual
# run on any branch.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Layout (see ADRs 0009 and 0022):
# - changes: says whether the PR touches anything besides docs and Markdown
#   (always "yes" outside a PR).
# - repo-hygiene: stack-neutral checks, always runs.
# - r-cmd-check: R CMD check (build, tests, examples, docs) on Windows with
#   all dependencies and without Suggests, and on Ubuntu with all
#   dependencies. Skipped on docs-only PRs. Every job checks against current
#   CRAN versions of all dependencies, including the recommended packages R
#   ships with, such as Matrix. Windows jobs install CRAN's Windows binaries.
#   The Ubuntu job runs in a pinned rocker/geospatial container, which
#   already has R and the system libraries (GDAL, GEOS, PROJ), so nothing is
#   installed with apt from the Ubuntu mirror; R packages come from current
#   P3M binaries. It also runs styler, lintr, the pkgdown config check and
#   test coverage, so each run sets up R on Ubuntu once. Coverage is reported in that job's log and is
#   not a gate. Every job caches its R package library, keyed by the
#   versions pak resolves, so a new CRAN release is still installed.
# - checks: the one required status check. It passes when every job it needs
#   passed or was skipped. Branch protection names only this job, so adding or
#   renaming a job never means touching the protection rules.
#
# The r-cmd-check jobs time out after 60 minutes, the others after 10.
# Normal runs take a few minutes; the long limit means a slow download makes
# a slow run, not a cancelled one. A stuck runner still fails; use "Re-run
# failed jobs" to get a fresh one.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  r-cmd-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.config.os }}
    # Jobs without a container entry run directly on the runner.
    container: ${{ matrix.config.container }}
    timeout-minutes: 60
    name: r-cmd-check (${{ matrix.config.os }}, ${{ matrix.config.deps }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # container: a pinned rocker/geospatial tag; bump it on purpose.
          # rspm: current P3M binaries for the image's Ubuntu release, so
          # the codename must match the image. cran: CRAN itself, set so it
          # replaces the image's own (dated) repository. extras: this job
          # also runs styler, lintr and coverage, so they need no R setup of
          # their own. Only this job sets it.
          - {os: ubuntu-latest, deps: 'all', extras: true,
             container: 'rocker/geospatial:4.6.1',
             rspm: 'https://p3m.dev/cran/__linux__/noble/latest',
             cran: 'https://cran.rstudio.com'}
          - {os: windows-latest, deps: 'all', extras: false}
          # Without Suggests: optional packages must be checked for, not
          # assumed. testthat is still installed to run the tests; lintr,
          # styler and covr are not.
          - {os: windows-latest, deps: 'hard', extras: false}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # The --as-cran time check needs an outside time server; skip it.
      _R_CHECK_SYSTEM_CLOCK_: false
      # pak does not install system requirements (Linux only; Windows has
      # none). It would run apt for every one listed, even those the image
      # already has. A dependency needing a library the image lacks fails
      # the job instead (ADR 0022).
      PKG_SYSREQS: false
    steps:
      # Keep LF line endings on Windows, so the check sees the same files.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # In the container R is already installed, so setup-r installs
      # nothing (and runs no apt): it only writes the repository settings,
      # P3M (named RSPM, from the RSPM variable) then CRAN, replacing the
      # image's own. pak treats a repository named CRAN more strictly: it
      # reinstalls a binary whose Built field differs from the index, which
      # would make the package cache useless. On Windows the repository is
      # CRAN only, not P3M: P3M's Windows index lists the recommended
      # packages (Matrix, lattice and others) under a path it does not
      # serve, so pak cannot download them from there (ADR 0022).
      - uses: r-lib/actions/setup-r@v2
        env:
          RSPM: ${{ matrix.config.rspm }}
        with:
          install-r: ${{ !matrix.config.container }}
          use-public-rspm: false
          cran: ${{ matrix.config.cran }}

      # In the container, put the cached library (R_LIBS_USER, set by
      # setup-r) first on the library path, ahead of the image's site
      # library, so pak installs into it and the package cache holds it.
      # The image's R_LIBS setting keeps an R_LIBS already set.
      - name: Library path for the package cache (container)
        if: matrix.config.container
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "R_LIBS=$R_LIBS_USER" >> "$GITHUB_ENV"

      # Every dependency is the current version from the repositories: pak
      # resolves against an empty library, and upgrade also replaces the
      # recommended packages R ships with, such as Matrix, when CRAN has a
      # newer version (P3M serves those as source on Linux, so they are
      # compiled there). pak installs into R_LIBS_USER, ahead of R's own
      # library and, in the container, the image's site library. The
      # package cache holds R_LIBS_USER. Its key is a hash of the lockfile
      # pak resolves, so a new CRAN version changes the key and is
      # installed; an exact hit installs nothing. cache-version keeps the
      # "hard" job from restoring the "all" job's library, Suggests
      # included.
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        with:
          cache: true
          cache-version: ${{ matrix.config.deps }}
          upgrade: 'TRUE'
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          extra-packages: any::rcmdcheck, any::testthat${{ matrix.config.extras && ', any::lintr, any::styler, any::covr, any::pkgdown, local::.' || '' }}
          needs: check

      # Style, lint and coverage run only in the extras job. Style and lint
      # run before the check, so they see only the source tree, not its
      # output in check/. Each later step still runs when an earlier one
      # failed, so one run reports every problem. A style, lint or check
      # failure fails this job, and so `checks`.
      - name: Check formatting (styler)
        if: matrix.config.extras && !cancelled() && steps.deps.outcome == 'success'
        run: styler::style_pkg(dry = "fail")
        shell: Rscript {0}

      - name: Lint (lintr)
        if: matrix.config.extras && !cancelled() && steps.deps.outcome == 'success'
        env:
          LINTR_ERROR_ON_LINT: true
        run: lintr::lint_package()
        shell: Rscript {0}

      # The site's reference index must list every exported topic, so a new
      # function or family is not left off the release site (ADR 0025).
      # This checks _pkgdown.yml only; the site is built on release.
      - name: Check pkgdown config
        if: matrix.config.extras && !cancelled() && steps.deps.outcome == 'success'
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        with:
          error-on: '"warning"'
          upload-snapshots: true

      # Report only: a failure here does not fail the job or the checks.
      - name: Test coverage
        if: matrix.config.extras && !cancelled() && steps.deps.outcome == 'success'
        continue-on-error: true
        run: print(covr::package_coverage())
        shell: Rscript {0}

  checks:
    needs: [changes, repo-hygiene, r-cmd-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - name: Lint markdown
        run: npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore LICENSE.md

      - name: No em dashes in tracked text
        run: |
          if git grep -In $'\xe2\x80\x94' -- . ':!LICENSE.md'; then
            echo "Em dash found. See CLAUDE.md: no em dashes in code, comments, docs, or commit messages." >&2
            exit 1
          fi

      - name: Docs structure present
        run: |
          test -f CLAUDE.md
          test -f docs/decisions/README.md
          test -f docs/handoffs/HANDOFF_TEMPLATE.md
          test -d docs/design
