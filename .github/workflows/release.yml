name: release

# Tags a release when a promotion PR merges into main (ADR 0028). The owner
# keeps two steps: bumping Version in DESCRIPTION, with its NEWS.md entry,
# in a PR into dev; and merging the promotion PR into main. On each push to
# main this reads Version from DESCRIPTION. If it is a release version
# (x.y.z, not a .9000 development version) and tag vX.Y.Z does not exist
# yet, it tags the pushed commit. The tag push starts pkgdown.yml, which
# deploys the site. A promotion that leaves the version alone tags nothing.
#
# workflow_dispatch does the same for main's latest commit, for example to
# retry after a failed run. Run it from main.
#
# The tag is made through the NCC ConsTech Automation GitHub App, not the
# built-in GITHUB_TOKEN: GitHub starts no workflows for a tag pushed with
# GITHUB_TOKEN, so pkgdown.yml would not run. Settings as in auto-merge.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is not a release version (x.y.z); nothing to tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get an app token
        if: steps.version.outputs.release == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; nothing to tag."
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          echo "Tagged $SHA as $TAG; pkgdown.yml deploys the site."
