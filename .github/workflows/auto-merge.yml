name: Enable auto-merge

# Arms GitHub's auto-merge on every PR opened from a branch in this repo, so
# it merges itself once the required "checks" job passes. Pushing a branch
# here needs write access, so this covers every collaborator; PRs from forks
# and from Dependabot are left to merge by hand (their runs cannot read the
# app's secret). A draft is armed when it is marked ready for review.
#
# Branching (ADR 0024): work PRs go into dev and are squashed. A promotion
# PR from dev into main is merged with a merge commit, so main and dev keep
# a shared history; promotions are opened only when the owner asks. Any
# other PR into main is not armed.
#
# It also brings a PR into dev level with dev as it arms it: dev's strict
# branch protection wants an up-to-date branch, and update-branches.yml only
# runs on a push to dev. main's protection is not strict: after a promotion
# main holds a merge commit that dev lacks, and making a promotion PR "up to
# date" would mean pushing that into the protected dev.
#
# Both act through the NCC ConsTech Automation GitHub App (org-owned), not
# the built-in GITHUB_TOKEN: GitHub starts no workflows for actions taken
# with GITHUB_TOKEN, so "Closes #N" would not close issues and an updated
# branch would never be re-checked. Settings: the AUTOMATION_APP_CLIENT_ID
# variable (the app's Client ID, not its App ID) and the
# AUTOMATION_APP_PRIVATE_KEY secret.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.base_ref == 'dev' ||
       (github.base_ref == 'main' && github.head_ref == 'dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          METHOD: ${{ github.base_ref == 'main' && '--merge' || '--squash' }}
        run: gh pr merge --auto "$METHOD" "$PR"

      - name: Bring it level with dev
        if: github.base_ref == 'dev'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr update-branch "$PR" || echo "already level with dev"
