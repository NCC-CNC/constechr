name: Keep PRs up to date

# Branch protection requires a PR to be up to date with dev before it
# merges, so when one PR merges, every other open one sits at BEHIND until
# someone updates it. After each push to dev, this updates each open PR into
# dev that has auto-merge armed; its checks then run again and auto-merge
# takes it from there. PRs without auto-merge, and promotion PRs into main
# (main's protection is not strict; ADR 0024), are left alone.
#
# Uses the NCC ConsTech Automation GitHub App, as auto-merge.yml does: an
# update pushed with the built-in GITHUB_TOKEN would not start the PR's
# checks, leaving it stuck.

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: update-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Update open PRs into dev that have auto-merge armed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --state open --base dev --json number,autoMergeRequest --jq '.[] | select(.autoMergeRequest != null) | .number')
          for n in $prs; do
            # Already up to date (or in conflict): GitHub says so, and that's fine.
            if gh pr update-branch "$n"; then echo "updated #$n"; else echo "#$n not updated"; fi
          done
