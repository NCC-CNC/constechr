name: pkgdown

# Publishes the pkgdown reference site to the gh-pages branch, for releases
# only (ADR 0025): the site always documents a released version, never
# unreleased dev code.
#
# - A release tag (vX.Y.Z, pushed on main's promotion merge commit; ADR 0004)
#   builds and deploys that tag.
# - workflow_dispatch rebuilds the site for a tag given as input, for
#   example to publish a release made before this workflow existed, or to
#   redeploy after a failed run. Run it from dev (the default branch); the
#   input must be a release tag. A tag made before _pkgdown.yml existed is
#   built with the _pkgdown.yml of the branch the workflow runs from.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string

# One deploy at a time; a newer one waits rather than cancelling the last.
concurrency:
  group: pkgdown
  cancel-in-progress: false

# Layout:
# - build: builds the site in the pinned rocker/geospatial container, as
#   CI's Ubuntu check does (ADR 0022). The image has R, GDAL and pandoc, so
#   nothing is installed with apt. It uploads the site as an artifact.
# - deploy: on a plain runner (which has git and rsync, as the deploy action
#   needs), pushes the site to gh-pages, replacing what was there.
jobs:
  build:
    runs-on: ubuntu-latest
    container: rocker/geospatial:4.6.1
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PKG_SYSREQS: false
      # Keep in step with the Ubuntu entry of ci.yml's matrix.
      RSPM: https://p3m.dev/cran/__linux__/noble/latest
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Not a release tag (vX.Y.Z): $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The site config of the branch the workflow runs from, used when the
      # tag has none.
      - uses: actions/checkout@v7
        with:
          path: workflow-ref
          sparse-checkout: _pkgdown.yml
          sparse-checkout-cone-mode: false

      - name: Site config for a tag without one
        run: |
          if [ ! -f _pkgdown.yml ]; then
            cp workflow-ref/_pkgdown.yml _pkgdown.yml
          fi
          rm -rf workflow-ref

      - uses: r-lib/actions/setup-r@v2
        with:
          install-r: false
          use-public-rspm: false
          cran: https://cran.rstudio.com

      - name: Library path for the package cache (container)
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "R_LIBS=$R_LIBS_USER" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          cache-version: pkgdown
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(dest_dir = "site", new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean: true
